      content="Aravindraj M is an AI engineer building AI agents, RAG pipelines, machine learning and computer vision applications."
    />
    <meta name="theme-color" content="#070a0f" />
    <script>
      // Apply the saved theme (dark by default) before first paint to avoid a flash of the wrong theme.
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("theme") || "dark";
        } catch (e) {}
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aravindraj M | AI Engineer" />

      property="og:description"
